name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Allow npm OIDC trusted publishing
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check for unpublished packages
        id: check
        run: |
          HAS_UNPUBLISHED=false
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ]; then
              name=$(node -p "require('./${dir}package.json').name")
              ver=$(node -p "require('./${dir}package.json').version")
              # If package or version not on npm, it needs publishing
              npm view "$name@$ver" version >/dev/null 2>&1 || { HAS_UNPUBLISHED=true; break; }
            fi
          done
          # Also check root package
          root_name=$(node -p "require('./package.json').name")
          root_ver=$(node -p "require('./package.json').version")
          npm view "$root_name@$root_ver" version >/dev/null 2>&1 || HAS_UNPUBLISHED=true
          echo "has_unpublished=$HAS_UNPUBLISHED" >> "$GITHUB_OUTPUT"
          echo "Unpublished packages: $HAS_UNPUBLISHED"

      - name: Create Release Pull Request
        if: steps.check.outputs.has_unpublished == 'false'
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.check.outputs.has_unpublished == 'true'
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
